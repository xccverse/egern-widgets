name: Spotify 去广告+解锁
description: 去广告（弹窗/首页/搜索页/信息流/AI DJ/埋点上报）+ 解锁 Premium（部分功能；超高音质除外）+ DualSubs 双语歌词（外语歌词译为简体中文，可配语言/翻译源）。需开启 MITM 并信任证书，建议登录后再启用，重启 Spotify 等待生效。解锁移植自 app2smile，去广告与新版 proto 整合自 Amlabort，双语歌词为 DualSubs 官方 Egern 模块 v1.10.0（VirgilClyne）。
open_url: https://dualsubs.github.io/settings/
mitm:
  hostnames:
    includes:
      - spclient.wg.spotify.com
      - '*.spclient.spotify.com'
      - aet.spotify.com
      - api.spotify.com
      - dualsubs.github.io
map_locals:
- match: '^https://dualsubs\.github\.io/api/Spotify(?:\?.*)?$'
  to: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/DualSubs.Spotify.PreferencePanes.json
  status_code: 200
header_rewrites:
- delete:
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/user-customization-service/v1/customize$'
    name: If-None-Match
    type: request
scriptings:
# ---------- 会员解锁 ----------
- http_response:
    name: Spotify-Proto解锁
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/(bootstrap/v1/bootstrap|user-customization-service/v1/customize)$'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-proto-ev3.js
    body_required: true
- http_request:
    name: Spotify-URL改写
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/(artistview/v1/artist|album-entity-view/v2/album)/'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spotify-json.js
# ---------- 去广告：直接拦截（空 200 打发） ----------
- http_request:
    name: Spotify-拦截埋点上报
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/gabo-receiver-service'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-reject.js
- http_request:
    name: Spotify-拦截弹窗广告
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)(:443)?/pendragon'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-reject.js
- http_request:
    name: Spotify-拦截会员信息展示
    match: '^https://.+-spclient\.spotify\.com(:443)?/pam-view-service/'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-reject.js
- http_request:
    name: Spotify-拦截AIDJ
    match: '^https://.*37i9dQZF1EYkqdzj48dyYq'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-reject.js
- http_request:
    name: Spotify-拦截广告统计域名
    match: '^https://aet\.spotify\.com/'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-reject.js
# ---------- 去广告：清洗页面广告位 ----------
- http_response:
    name: Spotify-去搜索页广告
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/browsita/v./browse'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-no-search-ad.js
    body_required: true
- http_response:
    name: Spotify-去首页广告
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/casita/v./home/default'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-no-home-ad.js
    body_required: true
- http_response:
    name: Spotify-去信息流广告
    match: '^https://(spclient\.wg\.spotify\.com|.+-spclient\.spotify\.com)/scrollsita/v./scroll/spotify'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/spotify/spot-no-scroll-ad.js
    body_required: true
# ---------- 双语歌词：DualSubs 官方 Egern 模块 v1.10.0（VirgilClyne） ----------
# 脚本托管在 GitHub releases，稳定可直连。默认：翻译+外部歌词、自动识别→简体中文、Google 翻译、网易云歌词源。
# 改配置去 open_url 的设置面板（https://dualsubs.github.io/settings/）。
- http_response:
    name: DualSubs-歌曲信息跟踪
    match: '^https?://api\.spotify\.com/v1/tracks\?'
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/response.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
- http_request:
    name: DualSubs-歌词请求改写(JSON)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/(.+)\?(.*)format=json'
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/request.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
- http_request:
    name: DualSubs-歌词请求改写(Proto)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/\w+\?(.*)'
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/request.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
    binary_body: true
- http_response:
    name: DualSubs-翻译歌词响应(JSON)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/(.+)\?(.*)format=json(.*)subtype=Translate'
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/Translate.response.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
- http_response:
    name: DualSubs-翻译歌词响应(Proto)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/\w+\?(.*)subtype=Translate'
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/Translate.response.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
    binary_body: true
- http_response:
    name: DualSubs-外部歌词响应(JSON)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/(.+)\?(.*)format=json(.*)subtype=External'
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/External.Lyrics.response.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
- http_response:
    name: DualSubs-外部歌词响应(Proto)
    match: '^https?://(.+-spclient|spclient\.wg)\.spotify\.com(:443)?/color-lyrics/v2/track/\w+\?(.*)subtype=External'
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/External.Lyrics.response.bundle.js
    env:
      _compat.$argument: 'Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"'
    body_required: true
    binary_body: true
