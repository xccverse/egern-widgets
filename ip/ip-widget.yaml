name: 节点 IP 检测
description: 实时显示 Egern 当前出口是 IPv4 还是 IPv6，并显示出口 IP 地址（走当前分流，即所选节点的实际出口）
env_schema:
  REFRESH_MINUTES:
    name: 刷新间隔（分钟）
    description: 范围 10 ~ 720，默认 30
    default_value: '30'
scriptings:
- generic:
    name: 节点 IP 检测
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/ip/ip-widget.js
    timeout: 30
widgets:
- name: 节点 IP 检测
  script_name: 节点 IP 检测
