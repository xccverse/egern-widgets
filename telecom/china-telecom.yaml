name: 中国电信
description: 电信话费/流量/语音小组件（含每 20 分钟定时保活）。原脚本 SIJULY/egern-radar，移植自 Scriptable 版 ChinaTelecom_2024（2Ya&脑瓜）
env_schema:
  CT_LOGIN_URL:
    name: 电信登录地址
    description: 抓包得到的登录 URL，用于自动更新 cookie（与 CT_COOKIE 二选一，URL 优先）
    default_value: ''
  CT_COOKIE:
    name: Cookie
    description: 直接填写 cookie（与 CT_LOGIN_URL 二选一）
    default_value: ''
  CT_SHOW_USED_FLOW:
    name: 显示已用流量
    description: 填 true 显示已用流量，不填显示剩余流量
    default_value: ''
  CT_SHOW_USED_VOICE:
    name: 显示已用语音
    description: 填 true 显示已用语音，不填显示剩余语音（不受上一项影响）
    default_value: ''
  CT_SHOW_DIRECT:
    name: 定向卡显示
    description: false 隐藏定向卡（3卡模式）；true 强制4卡；不填自动判断
    default_value: ''
  CT_TITLE:
    name: 小组件标题
    description: 默认 中国电信
    default_value: ''
  CT_KEEPALIVE:
    name: 定时保活开关
    description: 填 false 关闭保活；不填或填其他值均为开启。注意：这只是开关，保活间隔固定为 20 分钟（写在模块 schedule 里），填数字不能改间隔
    default_value: ''
  CT_DEBUG:
    name: 调试模式
    description: 填 1 在小组件标题旁显示保活诊断（上次保活时间/成功失败），排查掉线用
    default_value: ''
  CT_EXPIRE_WARN_DAYS:
    name: 过期预警天数
    description: 登录超过此天数未刷新时提前通知，默认 5 天；填 0 关闭预警
    default_value: ''
mitm:
  hostnames:
    includes:
      - e.dlife.cn
scriptings:
- generic:
    name: 中国电信
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/telecom/china-telecom.js
    timeout: 30
- http_request:
    name: 中国电信登录捕获
    match: '^https://e\.dlife\.cn/'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/telecom/china-telecom.js
- schedule:
    name: 中国电信保活
    cron: '*/20 * * * *'
    script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/telecom/china-telecom.js
widgets:
- name: 中国电信
  script_name: 中国电信
