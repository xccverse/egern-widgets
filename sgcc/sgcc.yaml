name: 网上国网（xccverse 改版）
description: 国家电网电费余额、昨日/本月/上月用电、近 30 日与月度柱状图；支持小/中/大号与锁屏。直连网上国网 App 接口，不经第三方网关；填写账号密码即可，每 6 小时自动更新。基于 zhaohantao1360-hash/Hark 的 sgcc-hark.js 修改，新增阶梯电价可配置。
author: xccverse（原版：Hark；App 协议移植自 stevenjoezhang/hass-state-grid，MIT）
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/83/d8/8a/83d88a92-5a4d-7a2f-118c-80d795e7a9f6/AppIcon-0-0-1x_U007emarketing-0-5-0-0-sRGB-85-220.png/144x144.png
env_schema:
  SGCC_USERNAME:
    name: 网上国网账号
    description: 登录网上国网 App 的手机号
    default_value: ''
  SGCC_PASSWORD:
    name: 网上国网密码
    description: 网上国网 App 的登录密码（没设过密码的先在 App 里设置一个）
    default_value: ''
  SGCC_SMS:
    name: 短信验证码
    description: 首次登录国网可能要求验证新设备，小组件提示后把收到的 6 位验证码填这里保存，再刷新小组件
    default_value: ''
  SGCC_ACCOUNT:
    name: 户号（可选）
    description: 多户号时填要显示的户号后 4 位；填 all 则一个小组件同屏显示全部户号；留空显示第一个
    default_value: ''
  SGCC_FOCUS:
    name: 重点户号（可选）
    description: SGCC_ACCOUNT填all时，大尺寸下哪家显示完整详情（含曲线图），填户号后 4 位；留空默认第一家
    default_value: ''
  SGCC_TIERS:
    name: 阶梯分界（可选）
    description: 年用电阶梯分界度数，逗号分隔；北京默认 2880,4800，其他省份按当地标准填
    default_value: ''
  SGCC_PRICES:
    name: 阶梯电价（可选）
    description: 阶梯电价（元/度），逗号分隔，与阶梯分界一一对应；北京默认 0.4883,0.5383,0.7883
    default_value: ''
  SGCC_POLICY:
    name: 国网请求策略
    description: 国网接口默认直连；直连不通再填国内节点或策略组名
    default_value: DIRECT
  SGCC_REFRESH:
    name: 刷新间隔（小时）
    description: 电量数据每天更新一次，间隔太短容易触发风控
    default_value: '6'
    options:
      - '3'
      - '6'
      - '12'
      - '24'
scriptings:
  - generic:
      name: sgcc
      script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/sgcc/sgcc.js
      timeout: 60
  - schedule:
      name: 网上国网定时更新
      cron: '17 */6 * * *'
      script_url: https://raw.githubusercontent.com/xccverse/egern-widgets/main/sgcc/sgcc.js
      timeout: 60
      env:
        SGCC_SCHEDULE: 'true'
widgets:
  - name: sgcc
    script_name: sgcc
